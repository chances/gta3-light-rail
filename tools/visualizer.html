<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTA III Track Visualizer</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/googlefonts/noto-emoji/main/png/128/emoji_u1f68a.png"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      /* ── Header ── */
      header {
        padding: 0.5rem 1rem;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 1rem;
        font-weight: 600;
        color: #e94560;
      }

      /* ── Drop zone ── */
      #drop-zone {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        border: 2px dashed #0f3460;
        margin: 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }
      #drop-zone.drag-over {
        border-color: #e94560;
        background: rgba(233, 69, 96, 0.08);
      }
      #drop-zone p {
        color: #888;
        font-size: 0.9rem;
      }
      #drop-zone label {
        cursor: pointer;
        background: #0f3460;
        color: #e0e0e0;
        padding: 0.4rem 1rem;
        border-radius: 0.3rem;
        font-size: 0.85rem;
      }
      #drop-zone label:hover {
        background: #e94560;
      }
      #file-input {
        display: none;
      }

      /* ── Viewer ── */
      #viewer {
        flex: 1;
        display: none; /* hidden until a file is loaded */
        flex-direction: column;
        overflow: hidden;
      }
      #viewer.visible {
        display: flex;
      }

      /* toolbar above SVG */
      #toolbar {
        padding: 0.35rem 0.75rem;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        font-size: 0.8rem;
        flex-shrink: 0;
      }
      #toolbar button {
        background: #0f3460;
        color: #e0e0e0;
        border: none;
        padding: 0.25rem 0.6rem;
        border-radius: 0.25rem;
        cursor: pointer;
        font-size: 0.8rem;
      }
      #toolbar button.active {
        background: #e94560;
        color: #fff;
      }
      #toolbar button:hover, #toolbar button:focus-visible {
        background: #e94560;
        outline: 2px solid #e94560;
        outline-offset: 2px;
      }

      /* Segmented view-toggle group */
      #view-toggle {
        display: inline-flex;
        border: 1px solid #0f3460;
        border-radius: 0.25rem;
        overflow: hidden;
      }
      #view-toggle button {
        border-radius: 0;
        border-right: 1px solid #0f3460;
      }
      #view-toggle button:last-child {
        border-right: none;
      }
      #info-bar {
        margin-left: auto;
        color: #888;
        white-space: nowrap;
      }

      /* SVG container */
      #svg-container {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      #map-svg {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #map-svg:active {
        cursor: grabbing;
      }

      /* Track lines */
      .track-segment {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .track-el {
        stroke: #f5a623;
        stroke-width: 2.5;
      } /* Portland El */
      .track-subway {
        stroke: #4fc3f7;
        stroke-width: 2.5;
      } /* Subway */

      /* Station dots */
      .station-dot {
        cursor: pointer;
      }
      .station-dot circle {
        fill: #e94560;
        stroke: #fff;
        stroke-width: 1.5;
        r: 5;
        transition: r 0.1s;
      }
      .station-dot:hover circle, .station-dot:focus circle {
        r: 8;
        outline: none;
      }
      .station-dot:focus-visible circle {
        stroke: #f5a623;
        stroke-width: 2.5;
      }
      /* Elevation-view axis lines and labels */
      .elev-axis line {
        stroke: #444;
        stroke-width: 1;
      }
      .elev-axis text {
        fill: #666;
        font-size: 10px;
      }
      .elev-ground {
        stroke: #333;
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }
      /* Station labels (shown at zoom > 1.5) */
      .station-label {
        font-size: 11px;
        fill: #fff;
        pointer-events: none;
        text-anchor: middle;
        dominant-baseline: hanging;
        paint-order: stroke;
        stroke: #1a1a2e;
        stroke-width: 3px;
        opacity: 0;
        transition: opacity 0.2s;
      }

      /* Tooltip */
      #tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(22, 33, 62, 0.95);
        border: 1px solid #0f3460;
        border-radius: 0.3rem;
        padding: 0.4rem 0.6rem;
        font-size: 0.78rem;
        line-height: 1.5;
        max-width: 220px;
        display: none;
        z-index: 10;
      }
      #tooltip strong {
        color: #f5a623;
      }
      #tooltip .coord {
        color: #aaa;
        font-size: 0.72rem;
      }

      /* Status message */
      #status {
        position: absolute;
        bottom: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(22, 33, 62, 0.9);
        border: 1px solid #0f3460;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.78rem;
        color: #888;
        pointer-events: none;
      }

      /* Keyboard shortcut help */
      #help {
        font-size: 0.72rem;
        color: #555;
      }

      /* Legend */
      #legend {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }
      .legend-swatch {
        width: 20px;
        height: 3px;
        border-radius: 2px;
        display: inline-block;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>GTA III Track Visualizer</h1>
      <span id="help">
        Scroll to zoom &nbsp;·&nbsp; Drag to pan &nbsp;·&nbsp; +/− keys &nbsp;·&nbsp; Arrow keys &nbsp;·&nbsp; R to
        reset
      </span>
    </header>

    <!-- Drop zone (visible before a file is loaded) -->
    <div
      id="drop-zone"
      role="region"
      aria-label="File drop zone"
      tabindex="0"
    >
      <p>
        Drop a <code>tracks.dat</code> or <code>tracks2.dat</code> file here
      </p>
      <p style="font-size: 0.75rem; color: #555">
        Files stay in your browser — nothing is uploaded to a remote server.
      </p>
      <label for="file-input">Browse files&hellip;</label>
      <input
        id="file-input"
        type="file"
        accept=".dat, text/plain"
        aria-label="Select a tracks.dat file"
        multiple
      />
    </div>

    <!-- Viewer (hidden until file loaded) -->
    <div id="viewer" role="main">
      <div id="toolbar">
        <div id="legend">
          <span class="legend-item">
            <span
              class="legend-swatch"
              style="background: #f5a623"
            ></span>Portland El
          </span>
          <span class="legend-item">
            <span
              class="legend-swatch"
              style="background: #4fc3f7"
            ></span>Subway
          </span>
          <!-- Dynamic legend entries — one per additional loaded track file -->
          <span id="legend-extra"></span>
          <span class="legend-item">
            <span
              style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e94560; border: 1.5px solid #fff"
            ></span>
            Station
          </span>
        </div>
        <span id="view-toggle" role="group" aria-label="View">
          <button id="btn-view-plan" class="active" title="Top-down plan view">Plan</button>
          <button id="btn-view-elev-e" title="Side profile looking north — horizontal axis: X (East), vertical axis: Z">
            Elevation E/W
          </button>
          <button id="btn-view-elev-n" title="Side profile looking east — horizontal axis: Y (North), vertical axis: Z">
            Elevation N/S
          </button>
        </span>
        <button id="btn-reset" title="Reset zoom and pan (R)">
          Reset view
        </button>
        <button id="btn-add" title="Load another file">+ Add file</button>
        <input
          id="file-input-add"
          type="file"
          accept=".dat, text/plain"
          aria-label="Add another tracks.dat file"
          multiple
          style="display: none"
        />
        <span id="info-bar" aria-live="polite"></span>
      </div>

      <div id="svg-container">
        <!--
      WCAG SVG accessibility:
        role="img"         — exposes the SVG as a single image to AT
        aria-labelledby    — links <title> + <desc> as the accessible name/description
        tabindex="0"       — keyboard-focusable for zoom/pan
    -->
        <svg
          id="map-svg"
          role="img"
          aria-labelledby="svg-title svg-desc"
          tabindex="0"
          focusable="true"
        >
          <title id="svg-title">GTA III Liberty City Rail Network</title>
          <desc id="svg-desc">
            Top-down map of the Liberty City rail network in GTA III. Shows track paths for the Portland El (orange) and
            Subway (blue) lines, with station stop markers. Coordinates are in meters (world space). Use scroll to zoom,
            drag to pan, arrow keys to pan, +/− to zoom, R to reset.
          </desc>

          <!--
        PLAN — game map background layer:
        When a raster map image (e.g. Liberty City.png) is available,
        an <image> element will be inserted here, sized and positioned
        to match GTA3 world coordinates. The GTA3 map covers roughly
        X: −2048 → +2048, Y: −2048 → +2048 (meters). The PNG will be
        georeferenced by aligning known landmarks (e.g. the train station
        at X≈−400, Y≈700) to the track node positions already rendered.
        A toggle button in the toolbar will show/hide the layer.
        Layer stacking order: <image> → track lines → station dots.
      -->
          <image
            id="bg-map"
            href=""
            x="-2048"
            y="-2048"
            width="4096"
            height="4096"
            preserveAspectRatio="xMidYMid meet"
            opacity="0.35"
            aria-hidden="true"
            style="display: none"
          />

          <!-- Zoom/pan group — D3 applies its transform here -->
          <g id="zoom-group"></g>
        </svg>

        <div id="tooltip" role="tooltip" aria-live="polite"></div>
        <div id="status" aria-live="polite">No file loaded</div>
      </div>
    </div>

    <script type="module">
      import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm";

      // ---------------------------------------------------------------------------
      // Geometry — ported from lib/geometry.ts (source of truth)
      // ---------------------------------------------------------------------------

      // Distance threshold (meters) below which endpoints are considered coincident.
      const CLOSE_THRESHOLD_M = 0.01;

      /**
       * Returns a node array guaranteed to form a closed loop.
       * Appends a copy of the first node if the endpoints are farther apart than
       * CLOSE_THRESHOLD_M (XY only; elevation is ignored at the join).
       * See lib/geometry.ts — closeTrackPath.
       */
      function closeTrackPath(nodes) {
        if (nodes.length < 2) return nodes;
        const first = nodes[0];
        const last = nodes[nodes.length - 1];
        const dx = last.x - first.x;
        const dy = last.y - first.y;
        if (Math.sqrt(dx * dx + dy * dy) <= CLOSE_THRESHOLD_M) return nodes;
        return [...nodes, { ...first }];
      }

      // ---------------------------------------------------------------------------
      // State
      // ---------------------------------------------------------------------------

      /** @type {{ nodes: TrackNode[], stations: TrackNode[], label: string, color: string, closed: boolean }[]} */
      const tracks = [];

      // Fixed colors for the two canonical track files
      const COLOR_EL = "#f5a623"; // Portland El — orange
      const COLOR_SUBWAY = "#4fc3f7"; // Subway — blue

      /**
       * Generates a random color that meets WCAG AA contrast (>=4.5:1) against
       * the dark background (#1a1a2e, relative luminance ≈ 0.012).
       *
       * Strategy: pick a random hue, fix saturation at 80% and lightness at
       * 62–72% — this range reliably clears the contrast threshold on dark
       * backgrounds while staying visually distinct from the El (orange, ~38°)
       * and Subway (light blue, ~198°) fixed colors.
       */
      /**
       * Hue ranges mapped to plain English color names.
       * Ordered so that the first matching entry wins.
       * Covers the full 0–360° wheel; gaps (excluded arcs) will never be
       * reached since randomAccessibleColor avoids them.
       */
      const HUE_NAMES = [
        [0, 15, "Red"],
        [15, 45, "Orange"], // excluded — too close to El
        [45, 75, "Yellow"],
        [75, 105, "Lime"],
        [105, 150, "Green"],
        [150, 170, "Teal"],
        [170, 200, "Cyan"], // excluded — too close to Subway
        [200, 255, "Cyan"], // (kept as fallback for fringe values)
        [255, 285, "Violet"],
        [285, 315, "Purple"],
        [315, 345, "Pink"],
        [345, 360, "Red"],
      ];

      /** Returns the plain English name for a hue (0–360). */
      function hueName(h) {
        for (const [lo, hi, name] of HUE_NAMES) {
          if (h >= lo && h < hi) return name;
        }
        return "Red"; // 360° wraps back to red
      }

      /**
       * Generates a random accessible HSL color and returns both the CSS string
       * and a plain English color name derived from the hue.
       * @returns {{ css: string, name: string }}
       */
      function randomAccessibleColor() {
        // Avoid hues too close to El (~38°) or Subway (~198°) so new tracks
        // stay visually distinct. Excluded arcs: [10°,70°] and [170°,230°].
        const EXCLUDED = [[10, 70], [170, 230]];
        let h;
        do {
          h = Math.random() * 360;
        } while (EXCLUDED.some(([lo, hi]) => h >= lo && h <= hi));
        // s=80%, l=67% gives comfortable contrast on #1a1a2e
        return { css: `hsl(${h.toFixed(0)}, 80%, 67%)`, name: hueName(h) };
      }

      // Active view: "plan" | "elev-e" | "elev-n"
      // plan   — top-down  (X → screen X,  Y → screen Y, flipped)
      // elev-e — east elevation (X → screen X, Z → screen Y, flipped) — looking north
      // elev-n — north elevation (Y → screen X, Z → screen Y, flipped) — looking east
      let activeView = "plan";

      // GTA3 world → screen: Y axis is flipped (world +Y = north = screen up)
      // D3 scales map world coords to SVG pixels; we apply them inside the zoom group.
      let xScale = d3.scaleLinear();
      let yScale = d3.scaleLinear(); // world Y negated → screen Y

      const svg = d3.select("#map-svg");
      const g = svg.select("#zoom-group");
      const tooltip = document.getElementById("tooltip");
      const status = document.getElementById("status");
      const infoBar = document.getElementById("info-bar");

      // ---------------------------------------------------------------------------
      // Zoom behavior (d3-zoom)
      // ---------------------------------------------------------------------------

      const zoom = d3.zoom()
        .scaleExtent([0.1, 40])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
          // Show station labels once zoomed in enough
          const k = event.transform.k;
          g.selectAll(".station-label").style("opacity", k > 2.5 ? 1 : 0);
        });

      svg.call(zoom);

      // Keyboard controls for the SVG element
      svg.node().addEventListener("keydown", (e) => {
        const PAN = 60;
        const ZOOM_FACTOR = 1.3;
        const t = d3.zoomTransform(svg.node());
        switch (e.key) {
          case "ArrowLeft":
            svg.call(zoom.translateBy, PAN, 0);
            e.preventDefault();
            break;
          case "ArrowRight":
            svg.call(zoom.translateBy, -PAN, 0);
            e.preventDefault();
            break;
          case "ArrowUp":
            svg.call(zoom.translateBy, 0, PAN);
            e.preventDefault();
            break;
          case "ArrowDown":
            svg.call(zoom.translateBy, 0, -PAN);
            e.preventDefault();
            break;
          case "+":
          case "=":
            svg.call(zoom.scaleBy, ZOOM_FACTOR);
            e.preventDefault();
            break;
          case "-":
          case "_":
            svg.call(zoom.scaleBy, 1 / ZOOM_FACTOR);
            e.preventDefault();
            break;
          case "r":
          case "R":
            resetView();
            e.preventDefault();
            break;
        }
      });

      document.getElementById("btn-reset").addEventListener("click", resetView);

      // View-toggle buttons
      const viewButtons = {
        "plan": document.getElementById("btn-view-plan"),
        "elev-e": document.getElementById("btn-view-elev-e"),
        "elev-n": document.getElementById("btn-view-elev-n"),
      };
      Object.entries(viewButtons).forEach(([view, btn]) => {
        btn.addEventListener("click", () => {
          if (activeView === view) return;
          activeView = view;
          Object.values(viewButtons).forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          // Update SVG accessible description
          document.getElementById("svg-desc").textContent = svgDesc();
          if (tracks.length > 0) {
            rebuildScales();
            render();
            fitAll();
          }
        });
      });

      function resetView() {
        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        fitAll();
      }

      function svgDesc() {
        if (activeView === "plan") {
          return "Top-down plan view of the Liberty City rail network. X axis = East, Y axis = North.";
        } else if (activeView === "elev-e") {
          return "East elevation of the rail network. Horizontal axis = X (East), vertical axis = Z (elevation). Looking north.";
        } else {
          return "North elevation of the rail network. Horizontal axis = Y (North), vertical axis = Z (elevation). Looking east.";
        }
      }

      // ---------------------------------------------------------------------------
      // Drop / file input
      // ---------------------------------------------------------------------------

      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const fileInputAdd = document.getElementById("file-input-add");
      const btnAdd = document.getElementById("btn-add");
      const viewer = document.getElementById("viewer");

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("drag-over");
      });
      dropZone.addEventListener(
        "dragleave",
        () => dropZone.classList.remove("drag-over"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        handleFiles(e.dataTransfer.files);
      });
      dropZone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") fileInput.click();
      });
      fileInput.addEventListener("change", (e) => handleFiles(e.target.files));
      fileInputAdd.addEventListener(
        "change",
        (e) => handleFiles(e.target.files),
      );
      btnAdd.addEventListener("click", () => fileInputAdd.click());

      async function handleFiles(fileList) {
        for (const file of fileList) {
          const text = await file.text();
          await loadDat(text, file.name);
        }
      }

      // ---------------------------------------------------------------------------
      // Parse & render
      // ---------------------------------------------------------------------------

      async function loadDat(text, filename) {
        // POST to server for parsing (reuses lib/tracks.ts logic)
        let data;
        try {
          const res = await fetch("/parse", {
            method: "POST",
            body: text,
            headers: { "content-type": "text/plain" },
          });
          data = await res.json();
          if (data.error) throw new Error(data.error);
        } catch (err) {
          setStatus(`Error parsing ${filename}: ${err.message}`);
          return;
        }

        // Determine color and label:
        //   tracks.dat  → El orange, "Portland El"
        //   tracks2.dat → Subway blue, "Subway"
        //   tracks3.dat and above, or any other filename → random accessible
        //   color with a generated "LRT {Color} Line" label
        let color, label;
        const lc = filename.toLowerCase();
        const isDefaultTrack = /^tracks2?\.dat$/i.test(filename);
        if (/^tracks2\.dat$/i.test(filename)) {
          color = COLOR_SUBWAY;
          label = "Subway";
        } else if (/^tracks\.dat$/i.test(filename)) {
          color = COLOR_EL;
          label = "Portland El";
        } else {
          const { css, name } = randomAccessibleColor();
          color = css;
          // Avoid duplicate color names if multiple extra files are loaded
          const usedNames = new Set(tracks.map((t) => t.label));
          let lineName = `LRT ${name} Line`;
          if (usedNames.has(lineName)) lineName = `LRT ${name} Line (${filename.replace(/\.dat$/i, "")})`;
          label = lineName;
        }

        // Close the path for the game's default track files (tracks.dat / tracks2.dat),
        // even if the underlying data does not end at its start point.
        const nodes = isDefaultTrack ? closeTrackPath(data.nodes) : data.nodes;

        tracks.push({ ...data, nodes, label, color, closed: isDefaultTrack });

        // Switch to viewer on first file
        dropZone.style.display = "none";
        viewer.classList.add("visible");

        rebuildScales();
        render();
        fitAll();
        updateInfoBar();
        setStatus(
          `Loaded "${filename}" — ${data.nodes.length} nodes, ${data.stations.length} stations`,
        );
      }

      // ---------------------------------------------------------------------------
      // Scales
      // ---------------------------------------------------------------------------

      function rebuildScales() {
        // Collect all nodes across all loaded tracks
        const allNodes = tracks.flatMap((t) => t.nodes);
        if (allNodes.length === 0) return;

        const W = svg.node().clientWidth || 800;
        const H = svg.node().clientHeight || 600;

        // Elevation views use Z as the vertical axis.
        // A small fixed padding (meters) is added around the bounding box.
        const PAD_HORIZ = 200; // horizontal world padding
        const PAD_VERT_ELEV = 5; // vertical (Z) padding for elevation views

        if (activeView === "plan") {
          const xs = allNodes.map((n) => n.x);
          const ys = allNodes.map((n) => n.y);
          const minX = Math.min(...xs) - PAD_HORIZ;
          const maxX = Math.max(...xs) + PAD_HORIZ;
          const minY = Math.min(...ys) - PAD_HORIZ;
          const maxY = Math.max(...ys) + PAD_HORIZ;
          const worldW = maxX - minX;
          const worldH = maxY - minY;
          const scale = Math.min(W / worldW, H / worldH);
          const offsetX = (W - worldW * scale) / 2;
          const offsetY = (H - worldH * scale) / 2;
          // X: world east → screen right
          xScale = d3.scaleLinear().domain([minX, maxX]).range([offsetX, offsetX + worldW * scale]);
          // Y: world north (up) → screen up
          yScale = d3.scaleLinear().domain([maxY, minY]).range([offsetY, offsetY + worldH * scale]);
        } else if (activeView === "elev-e") {
          // East elevation: horiz = X (east), vert = Z (elevation up)
          const xs = allNodes.map((n) => n.x);
          const zs = allNodes.map((n) => n.z);
          const minX = Math.min(...xs) - PAD_HORIZ;
          const maxX = Math.max(...xs) + PAD_HORIZ;
          const minZ = Math.min(...zs) - PAD_VERT_ELEV;
          const maxZ = Math.max(...zs) + PAD_VERT_ELEV;
          const worldW = maxX - minX;
          const worldH = maxZ - minZ;
          const scale = Math.min(W / worldW, H / worldH);
          const offsetX = (W - worldW * scale) / 2;
          const offsetY = (H - worldH * scale) / 2;
          xScale = d3.scaleLinear().domain([minX, maxX]).range([offsetX, offsetX + worldW * scale]);
          // Z: higher elevation → screen up
          yScale = d3.scaleLinear().domain([maxZ, minZ]).range([offsetY, offsetY + worldH * scale]);
        } else {
          // North elevation: horiz = Y (north), vert = Z (elevation up)
          const ys = allNodes.map((n) => n.y);
          const zs = allNodes.map((n) => n.z);
          const minY = Math.min(...ys) - PAD_HORIZ;
          const maxY = Math.max(...ys) + PAD_HORIZ;
          const minZ = Math.min(...zs) - PAD_VERT_ELEV;
          const maxZ = Math.max(...zs) + PAD_VERT_ELEV;
          const worldW = maxY - minY;
          const worldH = maxZ - minZ;
          const scale = Math.min(W / worldW, H / worldH);
          const offsetX = (W - worldW * scale) / 2;
          const offsetY = (H - worldH * scale) / 2;
          // Y: world north → screen right
          xScale = d3.scaleLinear().domain([minY, maxY]).range([offsetX, offsetX + worldW * scale]);
          // Z: higher elevation → screen up
          yScale = d3.scaleLinear().domain([maxZ, minZ]).range([offsetY, offsetY + worldH * scale]);
        }
      }

      // ---------------------------------------------------------------------------
      // Render
      // ---------------------------------------------------------------------------

      /** Returns the screen X coord for a node given the current view. */
      function screenX(n) {
        if (activeView === "elev-n") return xScale(n.y);
        return xScale(n.x); // plan and elev-e both use world X horizontally
      }

      /** Returns the screen Y coord for a node given the current view. */
      function screenY(n) {
        if (activeView === "plan") return yScale(n.y);
        return yScale(n.z); // elevation views use Z vertically
      }

      /** Draws architectural elevation axis lines: Z ticks on the left, ground datum. */
      function renderElevationAxes() {
        const allNodes = tracks.flatMap((t) => t.nodes);
        const zs = allNodes.map((n) => n.z);
        const minZ = Math.min(...zs);
        const maxZ = Math.max(...zs);

        // Determine horizontal span in screen coords for axis lines
        const allHoriz = activeView === "elev-n" ? allNodes.map((n) => xScale(n.y)) : allNodes.map((n) => xScale(n.x));
        const x0 = Math.min(...allHoriz);
        const x1 = Math.max(...allHoriz);

        const axisG = g.append("g").attr("class", "elev-axis").attr("aria-hidden", "true");

        // Z = 0 ground datum (dashed)
        if (minZ < 0 || maxZ > 0) {
          const y0 = yScale(0);
          axisG.append("line")
            .attr("class", "elev-ground")
            .attr("x1", x0 - 20).attr("x2", x1 + 20)
            .attr("y1", y0).attr("y2", y0);
          axisG.append("text")
            .attr("x", x0 - 22).attr("y", y0)
            .attr("text-anchor", "end")
            .attr("dominant-baseline", "middle")
            .text("Z 0");
        }

        // Z tick lines — one per ~10 m
        const tickStep = 10;
        const tickMin = Math.floor(minZ / tickStep) * tickStep;
        const tickMax = Math.ceil(maxZ / tickStep) * tickStep;
        for (let z = tickMin; z <= tickMax; z += tickStep) {
          const sy = yScale(z);
          axisG.append("line")
            .attr("x1", x0 - 6).attr("x2", x0)
            .attr("y1", sy).attr("y2", sy);
          axisG.append("text")
            .attr("x", x0 - 8).attr("y", sy)
            .attr("text-anchor", "end")
            .attr("dominant-baseline", "middle")
            .text(`Z ${z}`);
        }

        // Axis label
        const labelX = activeView === "elev-e" ? "X (m, East →)" : "Y (m, North →)";
        const midX = (x0 + x1) / 2;
        const labelY = yScale(minZ) + 20;
        axisG.append("text")
          .attr("x", midX).attr("y", labelY)
          .attr("text-anchor", "middle")
          .attr("fill", "#555")
          .attr("font-size", "11px")
          .text(labelX);
      }

      function render() {
        g.selectAll("*").remove();

        // Draw elevation axes before track lines so they appear behind
        if (activeView !== "plan") renderElevationAxes();

        const lineGen = d3.line()
          .x((n) => screenX(n))
          .y((n) => screenY(n));

        for (const track of tracks) {
          const trackG = g.append("g")
            .attr("class", "track-layer")
            .attr("aria-label", `${track.label} track`);

          // ── Track line ──
          trackG.append("path")
            .datum(track.nodes)
            .attr("class", "track-segment")
            .attr("d", lineGen)
            .attr("stroke", track.color)
            .attr("stroke-width", 2.5)
            .attr(
              "aria-label",
              `${track.label}: ${track.nodes.length} waypoints`,
            );

          // ── Station dots ──
          const stationG = trackG.selectAll(".station-dot")
            .data(track.stations)
            .join((enter) => {
              const grp = enter.append("g")
                .attr("class", "station-dot")
                // Each station is keyboard-focusable
                .attr("tabindex", "0")
                .attr("role", "button")
                .attr("aria-label", (n) => stationAriaLabel(n));

              grp.append("circle")
                .attr("cx", (n) => screenX(n))
                .attr("cy", (n) => screenY(n))
                .attr("r", 5)
                .attr("fill", "#e94560")
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5);

              // Station name label (visible when zoomed in)
              grp.append("text")
                .attr("class", "station-label")
                .attr("x", (n) => screenX(n))
                .attr("y", (n) => screenY(n) + 8)
                .text((n) => n.stationName ?? exitLabel(n.stationType));

              return grp;
            });

          // Tooltip events
          stationG
            .on("mouseenter focus", (event, n) => showTooltip(event, n, track))
            .on("mouseleave blur", () => hideTooltip())
            .on("keydown", (event, n) => {
              if (event.key === "Enter" || event.key === " ") {
                showTooltip(event, n, track);
              }
            });
        }
      }

      // ---------------------------------------------------------------------------
      // Fit view to all loaded tracks
      // ---------------------------------------------------------------------------

      function fitAll() {
        if (tracks.length === 0) return;
        const allNodes = tracks.flatMap((t) => t.nodes);
        const xs = allNodes.map((n) => screenX(n));
        const ys = allNodes.map((n) => screenY(n));

        const x0 = Math.min(...xs), x1 = Math.max(...xs);
        const y0 = Math.min(...ys), y1 = Math.max(...ys);

        const W = svg.node().clientWidth || 800;
        const H = svg.node().clientHeight || 600;
        const pad = 40;

        const scale = Math.min(
          (W - pad * 2) / (x1 - x0),
          (H - pad * 2) / (y1 - y0),
        );
        const tx = W / 2 - scale * (x0 + x1) / 2;
        const ty = H / 2 - scale * (y0 + y1) / 2;

        svg.transition().duration(600).call(
          zoom.transform,
          d3.zoomIdentity.translate(tx, ty).scale(scale),
        );
      }

      // ---------------------------------------------------------------------------
      // Tooltip helpers
      // ---------------------------------------------------------------------------

      function showTooltip(event, node, track) {
        const exit = exitLabel(node.stationType);
        const name = node.stationName ? `<strong>${node.stationName}</strong><br>` : "";
        tooltip.innerHTML = `
    ${name}
    <span>${track.label}</span><br>
    <span>Exit: ${exit}</span><br>
    <span class="coord">
      X: ${node.x.toFixed(1)} m &nbsp; Y: ${node.y.toFixed(1)} m &nbsp; Z: ${node.z.toFixed(1)} m
    </span>
  `;
        tooltip.style.display = "block";
        moveTooltip(event);
      }

      function moveTooltip(event) {
        // Prefer mouse coords; fall back to element position for keyboard events
        const container = document.getElementById("svg-container");
        const rect = container.getBoundingClientRect();
        const x = (event.clientX ?? event.target.getBoundingClientRect().left) -
          rect.left + 12;
        const y = (event.clientY ?? event.target.getBoundingClientRect().top) -
          rect.top - 12;
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      }

      function hideTooltip() {
        tooltip.style.display = "none";
      }

      function exitLabel(t) {
        return t === 1 ? "Left-side" : t === 2 ? "Right-side" : "None";
      }

      function stationAriaLabel(n) {
        const name = n.stationName ? `"${n.stationName}", ` : "";
        const exit = exitLabel(n.stationType);
        return `${name}station, ${exit} exit, at X ${n.x.toFixed(0)} m, Y ${n.y.toFixed(0)} m, elevation ${
          n.z.toFixed(0)
        } m`;
      }

      // ---------------------------------------------------------------------------
      // Info bar
      // ---------------------------------------------------------------------------

      function updateInfoBar() {
        const totalNodes = tracks.reduce((s, t) => s + t.nodes.length, 0);
        const totalStations = tracks.reduce((s, t) => s + t.stations.length, 0);
        infoBar.textContent = `${tracks.length} file${
          tracks.length !== 1 ? "s" : ""
        } · ${totalNodes} nodes · ${totalStations} stations`;

        // Rebuild dynamic legend entries for tracks that are not El or Subway
        const legendExtra = document.getElementById("legend-extra");
        legendExtra.innerHTML = "";
        for (const track of tracks) {
          if (track.color === COLOR_EL || track.color === COLOR_SUBWAY) continue;
          const item = document.createElement("span");
          item.className = "legend-item";
          item.innerHTML = `<span class="legend-swatch" style="background:${track.color}"></span>${track.label}`;
          legendExtra.appendChild(item);
        }
      }

      function setStatus(msg) {
        status.textContent = msg;
      }

      // ---------------------------------------------------------------------------
      // Drop zone keyboard
      // ---------------------------------------------------------------------------
      dropZone.addEventListener("click", () => fileInput.click());
    </script>
  </body>
</html>
